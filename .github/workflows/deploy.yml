name: Deploy to LXC

# Esto indica que el workflow se ejecutará cuando hagas push a la rama "main"
on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar despliegue vía SSH
        # Usamos una acción muy popular y probada de la comunidad para conexiones SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Aquí van exactamente los mismos comandos que usarías tú manualmente
          script: |
            cd /root/portfolio
            git pull origin main
            docker compose up -d --build
            # (Opcional) Limpiar imágenes viejas que queden huérfanas tras el build:
            docker image prune -f
