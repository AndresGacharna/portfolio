services:
  portfolio:
    # Imagen publicada por GitHub Actions en cada push a main.
    # En el servidor: docker compose pull && docker compose up -d
    image: ghcr.io/andresgacharna/portfolio:latest
    # Solo se usa en local (docker compose up --build); el servidor nunca compila.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-app
    restart: always
    ports:
      - "3000:3000" # Expone el puerto 3000 del contenedor al puerto 3000 de tu máquina/VM
    environment:
      - PORT=3000
      - NODE_ENV=production
